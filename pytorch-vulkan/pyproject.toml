[build-system]
requires = [
    "setuptools>=68",
    "torch>=2.12.0a0,<2.13",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-vulkan"
version = "0.2.0"
description = "Experimental PyTorch PrivateUse1 backend for Vulkan compute"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [
    {name = "Heiervang Technologies"},
]
dependencies = [
    "torch>=2.12.0a0,<2.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Issues = "https://github.com/heiervang-technologies/ht-pytorch/issues"
Repository = "https://github.com/heiervang-technologies/ht-pytorch"

[project.optional-dependencies]
test = ["expecttest>=0.3"]

[tool.setuptools]
include-package-data = true
packages = ["pytorch_vulkan"]

[tool.setuptools.package-data]
pytorch_vulkan = ["_shaders/*.spv"]
