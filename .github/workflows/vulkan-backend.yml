name: Vulkan backend

on:
  pull_request:
    paths:
      - "pytorch-vulkan/**"
      - ".github/workflows/vulkan-backend.yml"
  push:
    branches:
      - feat/vulkan-backend
    paths:
      - "pytorch-vulkan/**"
      - ".github/workflows/vulkan-backend.yml"
  workflow_dispatch:

concurrency:
  group: vulkan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTORCH_VULKAN_MAX_PENDING_DISPATCHES: "128"
  VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation

jobs:
  lavapipe:
    name: Lavapipe / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Vulkan build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            glslang-tools \
            libvulkan-dev \
            mesa-vulkan-drivers \
            spirv-tools \
            vulkan-tools \
            vulkan-validationlayers
      - name: Select Lavapipe
        run: |
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "${GITHUB_ENV}"
      - name: Install compatible PyTorch
        run: |
          python -m pip install "torch>=2.12,<2.13" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "expecttest>=0.3"
      - name: Build and install
        working-directory: pytorch-vulkan
        run: pip install -e . -v --no-build-isolation
      - name: Validate packaged SPIR-V
        run: |
          find pytorch-vulkan/pytorch_vulkan/_shaders -name '*.spv' -print0 |
            xargs -0 -n1 spirv-val --target-env vulkan1.2
      - name: Record Vulkan capabilities
        run: vulkaninfo --summary
      - name: Run acceptance tests
        working-directory: pytorch-vulkan
        run: |
          set -euo pipefail
          python tests/test_issue4_acceptance.py 2>&1 | tee validation.log
          python tests/test_tiny_llama.py 2>&1 | tee -a validation.log
          if grep -E "Validation Error|VUID-" validation.log; then
            exit 1
          fi

  hardware:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.vendor }} hardware
    strategy:
      fail-fast: false
      matrix:
        vendor: [nvidia, amd, intel]
    runs-on: [self-hosted, linux, vulkan, "${{ matrix.vendor }}"]
    steps:
      - uses: actions/checkout@v4
      - name: Install compatible PyTorch
        run: |
          python -m pip install "torch>=2.12,<2.13" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "expecttest>=0.3"
      - name: Build and install
        working-directory: pytorch-vulkan
        run: pip install -e . -v --no-build-isolation
      - name: Validate packaged SPIR-V
        run: |
          find pytorch-vulkan/pytorch_vulkan/_shaders -name '*.spv' -print0 |
            xargs -0 -n1 spirv-val --target-env vulkan1.2
      - name: Record Vulkan capabilities
        run: vulkaninfo --summary
      - name: Run acceptance tests
        working-directory: pytorch-vulkan
        run: |
          set -euo pipefail
          python tests/test_issue4_acceptance.py 2>&1 | tee validation.log
          python tests/test_tiny_llama.py 2>&1 | tee -a validation.log
          if grep -E "Validation Error|VUID-" validation.log; then
            exit 1
          fi
